services:
  datafev-flex:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${USER_ID:?Set USER_ID (id -u)}:${GROUP_ID:?Set GROUP_ID (id -g)}"
    container_name: datafev-flex
    ports:
      - "8000:8000"
    environment:
      DEFAULT_SOLVER_BACKEND: "glpk"
      DEFAULT_OUTPUT_DIR: "/app/outputs"
      STAGE1_CACHE_TTL_SECONDS: "900"
      STAGE1_CACHE_MAX_ITEMS: "128"
      DATABASE_URL: postgresql://dev:dev@postgres:5432/mydb
    volumes:
      - ./outputs:/app/outputs
      - ./inputs:/app/inputs:ro
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres-dev
    restart: no
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: mydb
    volumes:
      - ./tests/integration/init.sql:/docker-entrypoint-initdb.d/init.sql
